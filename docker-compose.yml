services:
  db:
    image: postgres:16-alpine
    container_name: minipay-db
    environment:
      POSTGRES_USER: minipay
      POSTGRES_PASSWORD: minipay
      POSTGRES_DB: minipay
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minipay"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
